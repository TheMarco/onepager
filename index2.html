<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>marco@portfolio — zsh — 142×42</title>
<meta name="description" content="Marco van Hylckama Vlieg / portfolio.shell — twenty years of product design and engineering, presented as a working terminal session." />
<meta name="theme-color" content="#0A0E13" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

<style>
/* ════════════════════════════════════════════════════════════════
   MARCO/SHELL — a portfolio that is also a working shell.
   Single file. No frameworks. Real interactive commands.
   ════════════════════════════════════════════════════════════════ */

:root {
  --bg:        #0A0E13;
  --bg-2:      #11161E;
  --bg-3:      #161C26;
  --surface:   #1B2230;
  --line:      #1E2533;
  --line-2:    #2A3242;

  --text:      #DCD7C7;
  --text-2:    #ACB1BD;
  --text-3:    #6B7180;
  --text-4:    #444B5A;

  --prompt:    #7AE6C0;   /* mint */
  --string:    #E8B65A;   /* amber */
  --keyword:   #82B7FF;   /* cool blue */
  --name:      #C297FF;   /* lavender */
  --accent:    #FF6685;   /* coral */
  --success:   #7AE39C;
  --warn:      #FFD24A;
  --error:     #FF6B6B;

  --traffic-r: #FF5F57;
  --traffic-y: #FEBC2E;
  --traffic-g: #28C840;

  --row:       1.55em;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  font-size: 13.5px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  font-variant-ligatures: contextual;
}

html { scroll-behavior: smooth; }
body {
  overflow: hidden;
  position: relative;
}

/* faint background gradient — like CRT phosphor glow */
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse at 50% 100%, rgba(122,230,192,0.04), transparent 60%),
    radial-gradient(ellipse at 0% 0%, rgba(130,183,255,0.03), transparent 50%);
  pointer-events: none;
  z-index: 0;
}

/* scanlines — extremely subtle */
body::after {
  content: '';
  position: fixed; inset: 0;
  background-image: repeating-linear-gradient(
    to bottom,
    transparent 0,
    transparent 2px,
    rgba(255,255,255,0.012) 2px,
    rgba(255,255,255,0.012) 3px
  );
  pointer-events: none;
  z-index: 100;
  mix-blend-mode: overlay;
}

::selection { background: rgba(122,230,192,0.3); color: var(--text); }

/* links: solid underline, prominent color, external-arrow suffix */
a {
  color: var(--keyword);
  text-decoration: none;
  border-bottom: 1px solid currentColor;
  padding-bottom: 0;
  cursor: pointer;
  transition: color .15s, background .15s;
  position: relative;
  z-index: 3;
}
a:hover {
  color: var(--prompt);
  background: rgba(122,230,192,0.08);
}
a[target="_blank"]::after {
  content: ' ↗';
  font-size: 0.85em;
  opacity: 0.85;
}
a[href^="mailto:"]::before {
  content: '✉ ';
  opacity: 0.7;
  margin-right: 2px;
}

/* ────────── WINDOW ────────── */
.term {
  position: fixed;
  inset: 0;
  display: grid;
  grid-template-rows: auto auto 1fr auto auto;
  background: var(--bg);
  z-index: 1;
  overflow: hidden;
}

/* titlebar with traffic lights */
.chrome {
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  background: linear-gradient(180deg, var(--bg-3), var(--bg-2));
  border-bottom: 1px solid var(--line);
  padding: 9px 16px;
  min-height: 38px;
}
.chrome__lights {
  position: absolute;
  left: 14px; top: 50%;
  transform: translateY(-50%);
  display: flex; gap: 8px;
}
.chrome__light {
  width: 13px; height: 13px;
  border-radius: 50%;
  background: var(--text-4);
  position: relative;
  cursor: pointer;
  transition: filter .25s;
}
.chrome__light--r { background: var(--traffic-r); }
.chrome__light--y { background: var(--traffic-y); }
.chrome__light--g { background: var(--traffic-g); }
.chrome__light:hover { filter: brightness(1.2); }
.chrome__title {
  font-size: 12px;
  color: var(--text-2);
  letter-spacing: 0.02em;
  user-select: none;
}
.chrome__title b { color: var(--text); font-weight: 500; }

/* tab strip */
.tabs {
  display: flex;
  background: var(--bg-2);
  border-bottom: 1px solid var(--line);
  font-size: 12px;
  overflow-x: auto;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 18px;
  color: var(--text-3);
  border-right: 1px solid var(--line);
  cursor: pointer;
  white-space: nowrap;
  transition: color .25s, background .25s;
  position: relative;
}
.tab:hover { color: var(--text-2); background: var(--bg-3); }
.tab.is-active {
  color: var(--text);
  background: var(--bg);
}
.tab.is-active::after {
  content: '';
  position: absolute;
  left: 0; right: 0; bottom: -1px;
  height: 2px; background: var(--prompt);
}
.tab__dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--text-4);
}
.tab.is-active .tab__dot { background: var(--prompt); box-shadow: 0 0 6px var(--prompt); }

/* main viewport */
.viewport {
  overflow-y: auto;
  overflow-x: auto;
  padding: 20px 0 8px 0;
  font-size: 13.5px;
  position: relative;
  z-index: 1;
  scrollbar-color: var(--line-2) transparent;
  scrollbar-width: thin;
}
.viewport::-webkit-scrollbar { width: 10px; height: 10px; }
.viewport::-webkit-scrollbar-track { background: transparent; }
.viewport::-webkit-scrollbar-thumb {
  background: var(--line-2);
  border: 2px solid var(--bg);
  border-radius: 5px;
}
.viewport::-webkit-scrollbar-thumb:hover { background: var(--text-4); }

.lines {
  padding: 0 24px;
  max-width: 1200px;
  position: relative;
}

/* every printed line */
.row {
  white-space: pre-wrap;
  word-break: break-word;
  font-family: inherit;
  min-height: var(--row);
}
.row + .row { /* default */ }

/* a prompt line preface, used in output history */
.ps {
  color: var(--text-3);
  user-select: none;
}
.ps .user    { color: var(--name); }
.ps .at      { color: var(--text-4); }
.ps .host    { color: var(--keyword); }
.ps .cwd     { color: var(--text-3); }
.ps .glyph   { color: var(--prompt); font-weight: 700; }

/* command echo in history */
.cmd-echo {
  color: var(--text);
}
.cmd-echo .kw { color: var(--prompt); }
.cmd-echo .arg { color: var(--text); }
.cmd-echo .flag { color: var(--string); }
.cmd-echo .str { color: var(--string); }

/* output styles */
.out-strong  { color: var(--text); font-weight: 500; }
.out-muted   { color: var(--text-3); }
.out-prompt  { color: var(--prompt); }
.out-string  { color: var(--string); }
.out-keyword { color: var(--keyword); }
.out-name    { color: var(--name); }
.out-accent  { color: var(--accent); }
.out-success { color: var(--success); }
.out-warn    { color: var(--warn); }
.out-error   { color: var(--error); }
.out-italic  { font-style: italic; color: var(--text-2); }
.out-bullet  { color: var(--prompt); }
.out-dim     { color: var(--text-4); }
.out-rule    { color: var(--line-2); }

/* banner */
.banner {
  color: var(--prompt);
  text-shadow: 0 0 18px rgba(122,230,192,0.25);
  letter-spacing: 0;
  margin: 0;
  font-size: 13.5px;
  line-height: 1.18;
}
.banner__caption {
  color: var(--text-3);
  margin-top: 0.4em;
  margin-bottom: 1em;
}

/* boxed panels */
.box {
  border: 1px solid var(--line-2);
  border-radius: 2px;
  padding: 14px 18px;
  margin: 8px 0 12px 0;
  background: rgba(255,255,255,0.012);
  display: inline-block;
}
.box--accent {
  border-color: var(--prompt);
  background: rgba(122,230,192,0.04);
}

/* tree output */
.tree-row { color: var(--text-2); }
.tree-row .tw { color: var(--text-4); }
.tree-row .dir { color: var(--keyword); font-weight: 500; }
.tree-row .file { color: var(--text); }
.tree-row .star { color: var(--string); margin-left: 4px; }
.tree-row .desc { color: var(--text-3); margin-left: 4px; }

/* ls -l output */
.ls-row { display: grid; grid-template-columns: 16px 110px 110px 90px 1fr; gap: 12px; color: var(--text-2); }
.ls-row .perm  { color: var(--text-3); }
.ls-row .owner { color: var(--text-3); }
.ls-row .size  { color: var(--text-3); text-align: right; }
.ls-row .date  { color: var(--text-3); }
.ls-row .name  { color: var(--keyword); font-weight: 500; }
.ls-row .name.file { color: var(--text); font-weight: 400; }
.ls-row .name.exec { color: var(--prompt); font-weight: 600; }
.ls-row .star  { color: var(--string); margin-left: 4px; }
@media (max-width: 640px) {
  .ls-row { grid-template-columns: 14px 1fr; }
  .ls-row .perm, .ls-row .owner, .ls-row .size, .ls-row .date { display: none; }
}

/* ps aux output */
.ps-row { display: grid; grid-template-columns: 70px 56px 1fr 90px; gap: 12px; color: var(--text-2); }
.ps-row .pid  { color: var(--text-3); }
.ps-row .cpu  { color: var(--prompt); text-align: right; }
.ps-row .cmd  { color: var(--text); }
.ps-row .stat { color: var(--text-3); }
@media (max-width: 640px) {
  .ps-row { grid-template-columns: 60px 1fr; }
  .ps-row .cpu, .ps-row .stat { display: none; }
}

/* man-page output */
.man h2 {
  display: block;
  color: var(--text);
  font-size: 13.5px;
  font-weight: 700;
  margin-top: 16px;
  margin-bottom: 4px;
  letter-spacing: 0.03em;
}
.man p, .man li { color: var(--text-2); margin: 0 0 0 4px; }
.man ul { list-style: none; margin: 4px 0 0 0; }
.man ul li::before { content: '·  '; color: var(--prompt); }

/* hr-ish separator */
.sep {
  color: var(--line-2);
  user-select: none;
}

/* keyboard hint chip */
.kb {
  display: inline-block;
  padding: 1px 6px;
  border: 1px solid var(--line-2);
  border-bottom-width: 2px;
  border-radius: 3px;
  font-size: 11px;
  color: var(--text-2);
  background: var(--bg-3);
  margin: 0 2px;
}

/* ────────── PROMPT (interactive) ────────── */
.prompt {
  border-top: 1px solid var(--line);
  background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13.5px;
  position: relative;
}
.prompt__suggestion {
  position: absolute;
  left: 24px; top: 12px;
  font-size: 11px;
  color: var(--text-4);
  letter-spacing: 0.03em;
  animation: fadeOut 18s ease forwards;
  pointer-events: none;
}
@keyframes fadeOut {
  0%, 80% { opacity: 1; transform: translateY(0); }
  100%    { opacity: 0; transform: translateY(-6px); }
}
.prompt__ps {
  font-family: inherit;
  display: inline-flex;
  align-items: center;
  gap: 0;
  white-space: nowrap;
}
.prompt__input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text);
  font-family: inherit;
  font-size: 13.5px;
  padding: 0;
  caret-color: transparent;
  font-weight: 400;
}
.prompt__caret {
  display: inline-block;
  width: 8.5px;
  height: 1.2em;
  background: var(--prompt);
  vertical-align: text-bottom;
  margin-left: -2px;
  box-shadow: 0 0 8px rgba(122,230,192,0.5);
  animation: caret 1.05s steps(2, jump-none) infinite;
}
@keyframes caret { 50% { opacity: 0; } }

/* ────────── STATUS BAR ────────── */
.status {
  display: flex;
  align-items: center;
  background: var(--bg-2);
  border-top: 1px solid var(--line);
  padding: 6px 16px;
  font-size: 11px;
  color: var(--text-3);
  gap: 16px;
  white-space: nowrap;
  overflow-x: auto;
}
.status::-webkit-scrollbar { display: none; }
.status__item { display: inline-flex; align-items: center; gap: 6px; }
.status__item b { color: var(--text-2); font-weight: 500; letter-spacing: 0.02em; }
.status__sep { color: var(--text-4); }
.status__pulse {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--prompt);
  box-shadow: 0 0 6px var(--prompt);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%   { box-shadow: 0 0 0 0 rgba(122,230,192,0.5); }
  70%  { box-shadow: 0 0 0 6px rgba(122,230,192,0); }
  100% { box-shadow: 0 0 0 0 rgba(122,230,192,0); }
}
.status__spacer { flex: 1; }

/* power/wifi/battery glyphs as plain text */
.status__glyph { color: var(--text-3); font-size: 11px; }

/* responsive */
@media (max-width: 760px) {
  .chrome__title { font-size: 10px; padding: 0 40px; text-align: center; }
  .lines { padding: 0 14px; }
  .prompt { padding: 12px 14px; }
  .status { padding: 6px 10px; gap: 10px; }
  .status .opt { display: none; }
}

/* the in-stream loader */
.boot {
  color: var(--text-3);
  margin-bottom: 6px;
}
.boot .ok { color: var(--success); }
.boot .err { color: var(--error); }
.boot .wait { color: var(--warn); }

/* small in-line ASCII portrait */
.spark {
  color: var(--prompt);
  text-shadow: 0 0 12px rgba(122,230,192,0.4);
}
</style>
</head>

<body>

<div class="term">

  <!-- Titlebar -->
  <header class="chrome">
    <div class="chrome__lights">
      <span class="chrome__light chrome__light--r" title="close"></span>
      <span class="chrome__light chrome__light--y" title="minimize"></span>
      <span class="chrome__light chrome__light--g" title="zoom"></span>
    </div>
    <div class="chrome__title">
      <b>marco@portfolio</b> — zsh — <span id="termSize">142×42</span>
    </div>
  </header>

  <!-- Tabs -->
  <nav class="tabs" aria-label="terminal tabs">
    <div class="tab is-active"><span class="tab__dot"></span>~/portfolio · zsh</div>
    <div class="tab"><span class="tab__dot"></span>~/resume · vim</div>
    <div class="tab"><span class="tab__dot"></span>~/lab · node</div>
    <div class="tab"><span class="tab__dot"></span>~/contact · mail</div>
  </nav>

  <!-- Viewport: scrollable terminal session -->
  <main class="viewport" id="viewport" tabindex="0">
    <div class="lines" id="lines">
      <!-- content streamed by JS -->
    </div>
  </main>

  <!-- Interactive prompt -->
  <form class="prompt" id="prompt" autocomplete="off" spellcheck="false">
    <span class="prompt__suggestion" id="hint">try <span class="kb">help</span> · <span class="kb">ls</span> · <span class="kb">cat about.md</span> · <span class="kb">man marco</span> · <span class="kb">↑</span> for history</span>
    <span class="prompt__ps">
      <span style="color:var(--name);">marco</span><span style="color:var(--text-4);">@</span><span style="color:var(--keyword);">portfolio</span><span style="color:var(--text-3);"> </span><span style="color:var(--text-3);" id="cwd">~</span><span style="color:var(--prompt);font-weight:700; margin: 0 8px 0 6px;">%</span>
    </span>
    <input
      type="text"
      class="prompt__input"
      id="promptInput"
      aria-label="terminal input"
      autocapitalize="off"
      autocorrect="off"
    />
    <span class="prompt__caret" id="caret" aria-hidden="true"></span>
  </form>

  <!-- Status bar -->
  <footer class="status">
    <div class="status__item"><span class="status__pulse"></span> <b>open to roles</b></div>
    <span class="status__sep">│</span>
    <div class="status__item opt"><b>marco/shell</b> v.2026.05.17</div>
    <span class="status__sep opt">│</span>
    <div class="status__item opt">zsh 5.9</div>
    <span class="status__sep opt">│</span>
    <div class="status__item opt"><b>UTF-8</b></div>
    <div class="status__spacer"></div>
    <div class="status__item">PDX · <span id="localTime">--:--:--</span></div>
    <span class="status__sep">│</span>
    <div class="status__item opt">⌁ AC</div>
    <span class="status__sep opt">│</span>
    <div class="status__item">100%</div>
  </footer>
</div>

<script>
/* ════════════════════════════════════════════════════════════════
   MARCO/SHELL runtime
   ════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  const $lines  = document.getElementById('lines');
  const $view   = document.getElementById('viewport');
  const $form   = document.getElementById('prompt');
  const $input  = document.getElementById('promptInput');
  const $hint   = document.getElementById('hint');
  const $cwd    = document.getElementById('cwd');
  const $time   = document.getElementById('localTime');
  const $size   = document.getElementById('termSize');

  /* ───── live clock + window size readout ───── */
  function tickClock() {
    const t = new Date();
    const fmt = new Intl.DateTimeFormat('en-US', {
      timeZone: 'America/Los_Angeles',
      hour12: false,
      hour: '2-digit', minute: '2-digit', second: '2-digit'
    });
    $time.textContent = fmt.format(t);
  }
  setInterval(tickClock, 1000); tickClock();

  function updateSize() {
    // approximate cells based on viewport width / font width (~7.5px) and row height (1.55 * 13.5)
    const cols = Math.round(innerWidth / 8.1);
    const rows = Math.round(innerHeight / 21);
    $size.textContent = `${cols}×${rows}`;
  }
  updateSize();
  window.addEventListener('resize', updateSize);

  /* ───── helpers to print lines ───── */
  function el(tag, cls, html) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }
  function scrollEnd(smooth) {
    $view.scrollTo({ top: $view.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
  }
  function print(html, cls) {
    const r = el('div', 'row ' + (cls || ''), html);
    $lines.appendChild(r);
    scrollEnd(false);
    return r;
  }
  function printPS(cmd) {
    print(
      `<span class="ps"><span class="user">marco</span><span class="at">@</span><span class="host">portfolio</span><span class="at"> </span><span class="cwd">${cwd}</span><span class="glyph"> %</span></span> <span class="cmd-echo">${highlightCmd(cmd)}</span>`
    );
  }
  function highlightCmd(cmd) {
    // very small highlighter for the echoed command
    const parts = cmd.split(/\s+/);
    if (!parts[0]) return '';
    let out = `<span class="kw">${escapeHtml(parts[0])}</span>`;
    for (let i = 1; i < parts.length; i++) {
      const p = parts[i];
      if (p.startsWith('--') || p.startsWith('-')) out += ' <span class="flag">' + escapeHtml(p) + '</span>';
      else if (p.startsWith('"') || p.startsWith("'")) out += ' <span class="str">' + escapeHtml(p) + '</span>';
      else out += ' <span class="arg">' + escapeHtml(p) + '</span>';
    }
    return out;
  }
  function blank() { $lines.appendChild(el('div', 'row')); }
  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c])
    );
  }

  /* type a single line character-by-character */
  function typeLine(text, cls, speed) {
    return new Promise(resolve => {
      const r = print('', cls);
      let i = 0;
      const step = () => {
        r.innerHTML = text.slice(0, i) + '<span style="color:var(--prompt);">▌</span>';
        if (i++ >= text.length) {
          r.innerHTML = text;
          resolve();
        } else {
          setTimeout(step, speed || 14);
        }
      };
      step();
    });
  }
  function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

  /* ════════ SIMULATED FILESYSTEM ════════ */
  let cwd = '~';

  const fs = {
    '~': {
      type: 'dir',
      children: ['about.md', 'resume.txt', 'now.md', 'contact.md', 'manifesto.md', 'career/', 'lab/', 'capabilities/', '.hidden/']
    },
    '~/career': {
      type: 'dir',
      children: ['kohls.md', 'walmart-labs.md', 'google.md', 'yahoo.md', 'endemol.md', 'ai-created.md']
    },
    '~/lab': {
      type: 'dir',
      children: ['ai-tools/', 'games/', 'experiments/']
    },
    '~/lab/ai-tools': {
      type: 'dir',
      children: ['my-ai-diary.app', 'human-actually.app', 'watchgpt.watchos', 'ai-usage.macos', 'calorie-counter.pwa', 'thought2tweet.app']
    },
    '~/lab/games': {
      type: 'dir',
      children: ['vectronix.canvas', 'radial-drift.webgl', 'hexax.canvas']
    },
    '~/lab/experiments': {
      type: 'dir',
      children: ['audio-visualizer-suite', 'color-clock', 'jumbotron-simulator', 'last-weather-app']
    },
    '~/capabilities': {
      type: 'dir',
      children: ['ai-native-design.txt', 'design-engineering.txt', '0-to-1.txt', 'enterprise-ux.txt', 'internal-ai-tooling.txt', 'leadership.txt']
    },
    '~/.hidden': {
      type: 'dir',
      children: ['easter.md']

          const node = fs[path];
          if (!node) return;
          const kids = node.children;
          kids.forEach((k, i) => {
            const last = i === kids.length - 1;
            const branch = last ? '└── ' : '├── ';
            const childPath = path.endsWith('/') ? path + k.replace(/\/$/, '') : path + '/' + k.replace(/\/$/, '');

            lines.push(tag);
            if (isDir && fs[childPath]) {

            }
          });

  /* ════════ HELPERS ════════ */

  function resolvePath(p) {
    if (!p) return cwd;
    if (p === '~' || p === '~/') return '~';
    if (p === '..') {
      if (cwd === '~') return '~';
      const parts = cwd.split('/');
      parts.pop();
      return parts.join('/') || '~';
    }
    if (p === '.') return cwd;
    if (p.startsWith('~')) return p.replace(/\/$/, '');
    // relative
    let combined = cwd === '~' ? '~/' + p : cwd + '/' + p;
    combined = combined.replace(/\/+/g, '/').replace(/\/$/, '');
    // also try matching a directory variant
    if (fs[combined]) return combined;
    if (fs[combined + '/']) return combined + '/';
    if (fs['~/' + p]) return '~/' + p;
    // file name inside cwd?
    if (cwd === '~' && fs['~'] && fs['~'].children.includes(p)) return '~/' + p;
    if (fs[cwd] && fs[cwd].children && fs[cwd].children.includes(p)) return cwd + '/' + p;
    return combined;
  }

  /* ════════ COMMAND RUNNER ════════ */
  const history = [];
  let histIdx = -1;

  async function exec(line) {
    const raw = line.trim();
    if (!raw) { printPS(''); return; }

    history.push(raw);
    histIdx = history.length;

    printPS(raw);

    const [name, ...args] = raw.split(/\s+/);
    const lookup = name.toLowerCase();

    // shortcuts like `cat README` → cat readme
    let cmd = commands[lookup];
    // multi-word: e.g., "sudo hire-me"  is handled inside sudo
    if (!cmd) {
      // see if there's an alias
      cmd = commands[name];
    }

    if (!cmd) {
      print(`<span class="out-error">zsh: command not found: ${escapeHtml(name)}</span>
<span class="out-muted">try </span><span class="out-string">help</span><span class="out-muted">.</span>`);
      return;
    }

    try {
      const out = await Promise.resolve(cmd.run(args));
      if (out != null && out !== '') {
        print(out);
      }
    } catch (e) {
      print(`<span class="out-error">error: ${escapeHtml(e.message || String(e))}</span>`);
    }
  }

  /* ════════ INPUT BEHAVIOR ════════ */
  $form.addEventListener('submit', (e) => {
    e.preventDefault();
    const v = $input.value;
    $input.value = '';
    exec(v);
  });

  $input.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (history.length && histIdx > 0) {
        histIdx--;
        $input.value = history[histIdx];
        // place cursor at end
        setTimeout(() => { $input.selectionStart = $input.selectionEnd = $input.value.length; }, 0);
      }
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (histIdx < history.length - 1) {
        histIdx++;
        $input.value = history[histIdx];
      } else {
        histIdx = history.length;
        $input.value = '';
      }
    } else if (e.key === 'Tab') {
      e.preventDefault();
      const v = $input.value;
      const parts = v.split(/\s+/);
      if (parts.length <= 1) {
        const opts = Object.keys(commands).filter(n => n.startsWith(parts[0]));
        if (opts.length === 1) $input.value = opts[0] + ' ';
        else if (opts.length > 1) {
          print(`<span class="out-muted">${opts.join('   ')}</span>`);
        }
      } else {
        // file completion in current dir
        const last = parts[parts.length - 1];
        const dirNode = fs[cwd];
        if (dirNode) {
          const opts = dirNode.children.filter(c => c.startsWith(last));
          if (opts.length === 1) {
            parts[parts.length - 1] = opts[0];
            $input.value = parts.join(' ');
          } else if (opts.length > 1) {
            print(`<span class="out-muted">${opts.join('   ')}</span>`);
          }
        }
      }
    } else if (e.key === 'l' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      commands.clear.run();
    }
  });

  // keep input focused; click anywhere returns focus — EXCEPT on links,
  // form fields, buttons, or selected text the user is reading.
  document.addEventListener('mousedown', (e) => {
    let t = e.target;
    if (t && t.nodeType === Node.TEXT_NODE) t = t.parentElement;
    if (!t) return;
    if (t.closest('a, input, button, .tab, .chrome__light')) return;
    // also don't steal focus if the user has selected text
    const sel = window.getSelection && window.getSelection();
    if (sel && sel.toString().length > 0) return;
    setTimeout(() => $input.focus(), 0);
  });

  function bootSequence() {

  async function intro() {
    // skip if user presses enter during intro
    let skipped = false;
    function skip() { skipped = true; }

    const boot = bootSequence();

      await wait(b.d);

  async function typeAndRun(cmd) {
    // type the command into a fresh prompt line, then exec
    const r = el('div', 'row');
    r.innerHTML = `<span class="ps"><span class="user">marco</span><span class="at">@</span><span class="host">portfolio</span><span class="at"> </span><span class="cwd">${cwd}</span><span class="glyph"> %</span></span> `;
    const span = el('span', 'cmd-echo');
    r.appendChild(span);
    $lines.appendChild(r);

    // type characters
    for (let i = 0; i <= cmd.length; i++) {
      span.innerHTML = highlightCmd(cmd.slice(0, i)) + '<span style="color:var(--prompt);">▌</span>';
      await wait(18 + Math.random() * 22);
      scrollEnd(false);
    }
    span.innerHTML = highlightCmd(cmd);

    await wait(180);

    // dispatch w/o re-printing the PS line
    const [name, ...args] = cmd.trim().split(/\s+/);
    const c = commands[name.toLowerCase()];
    if (c) {
      const out = await Promise.resolve(c.run(args));
      if (out != null && out !== '') print(out);
    }
  }

  /* ════════ KICKOFF ════════ */

  /* ── tab strip click switches dummy state (only one shell, but the affordance is real) ── */
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.addEventListener('click', () => {

      if (i === 1) exec('cat resume.txt');

  /* ── chrome traffic lights ── */
  document.querySelector('.chrome__light--r').addEventListener('click', () => {
